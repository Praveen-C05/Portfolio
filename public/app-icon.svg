<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2327" />
      <stop offset="50%" stop-color="#121517" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF66" />
      <stop offset="100%" stop-color="#B8FF45" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base matching macOS 128px radius at 512px -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="6" />

  <!-- Inner subtle grid mesh -->
  <path d="M 128 64 L 128 448 M 256 64 L 256 448 M 384 64 L 384 448 M 64 128 L 448 128 M 64 256 L 448 256 M 64 384 L 448 384" 
        stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" />

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="240" r="100" fill="#B8FF45" fill-opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Architectural 'P' & Cloud Architecture Node -->
  <!-- Vertical Stem -->
  <rect x="168" y="132" width="44" height="248" rx="22" fill="url(#accentGrad)" />

  <!-- Curved P Loop -->
  <path d="M 192 132 L 280 132 C 342 132 384 168 384 224 C 384 280 342 316 280 316 L 192 316 Z" 
        fill="none" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tech Accent Sparkle / Connection Node -->
  <circle cx="284" cy="224" r="16" fill="#121517" stroke="#B8FF45" stroke-width="6" />
  <circle cx="340" cy="350" r="8" fill="#B8FF45" />
</svg>
