<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#00BFA6"/>
    </linearGradient>
    <style>
      .bg{fill:#0f1724}
      .card{fill:#0b1220;stroke:#1f2937;stroke-width:2}
      .panel{fill:#0b1220;stroke:#16202a;stroke-width:1}
      .accent{fill:url(#g)}
      .muted{fill:#9aa4b2;font-family:Inter, Arial, sans-serif}
      .title{fill:#ffffff;font-family:Inter, Arial, sans-serif;font-weight:700}
    </style>
  </defs>

  <rect class="bg" width="1200" height="800" rx="24"/>

  <!-- Left menu -->
  <rect x="40" y="48" width="220" height="704" class="card" rx="12"/>
  <g transform="translate(60,80)">
    <rect width="160" height="40" rx="8" class="accent"/>
    <text x="20" y="28" class="title" font-size="14">Monarc ERP</text>

    <g transform="translate(0,64)">
      <rect width="160" height="36" rx="8" class="panel"/>
      <text x="16" y="24" class="muted" font-size="12">Dashboard</text>
    </g>
    <g transform="translate(0,112)">
      <rect width="160" height="36" rx="8" class="panel"/>
      <text x="16" y="24" class="muted" font-size="12">Students</text>
    </g>
    <g transform="translate(0,160)">
      <rect width="160" height="36" rx="8" class="panel"/>
      <text x="16" y="24" class="muted" font-size="12">Courses</text>
    </g>
    <g transform="translate(0,208)">
      <rect width="160" height="36" rx="8" class="panel"/>
      <text x="16" y="24" class="muted" font-size="12">Attendance</text>
    </g>
  </g>

  <!-- Main area -->
  <rect x="292" y="48" width="848" height="704" class="card" rx="12"/>

  <!-- Top bar -->
  <rect x="312" y="64" width="804" height="56" rx="8" fill="#071124"/>
  <text x="328" y="100" class="muted" font-size="13">Welcome back — Monarc ERP</text>

  <!-- KPI cards -->
  <g transform="translate(320,140)">
    <rect width="200" height="96" rx="10" fill="#071428" stroke="#152834"/>
    <text x="16" y="30" class="title" font-size="18">1,240</text>
    <text x="16" y="56" class="muted" font-size="12">Active Students</text>
  </g>
  <g transform="translate(540,140)">
    <rect width="200" height="96" rx="10" fill="#071428" stroke="#152834"/>
    <text x="16" y="30" class="title" font-size="18">86</text>
    <text x="16" y="56" class="muted" font-size="12">Courses</text>
  </g>
  <g transform="translate(760,140)">
    <rect width="200" height="96" rx="10" fill="#071428" stroke="#152834"/>
    <text x="16" y="30" class="title" font-size="18">98%</text>
    <text x="16" y="56" class="muted" font-size="12">Attendance Rate</text>
  </g>

  <!-- Chart area -->
  <rect x="320" y="268" width="640" height="220" rx="10" fill="#06111a" stroke="#12313d"/>
  <g transform="translate(340,300)">
    <rect x="0" y="80" width="40" height="40" rx="6" fill="#2b9cff"/>
    <rect x="60" y="50" width="40" height="70" rx="6" fill="#47d7a6"/>
    <rect x="120" y="20" width="40" height="100" rx="6" fill="#ffd166"/>
    <rect x="180" y="60" width="40" height="60" rx="6" fill="#ff6b6b"/>
  </g>

  <!-- List / Table -->
  <rect x="320" y="506" width="640" height="200" rx="10" fill="#06111a" stroke="#12313d"/>
  <g transform="translate(340,526)">
    <rect width="560" height="36" rx="6" fill="#0b2030"/>
    <text x="12" y="22" class="muted" font-size="13">Recent activity — fees paid, enrollments, and updates</text>

    <g transform="translate(0,44)">
      <text x="12" y="20" class="muted" font-size="12">1. John Doe — Fee payment received</text>
      <text x="12" y="40" class="muted" font-size="12">2. Jane Smith — Enrolled in Data Structures</text>
    </g>
  </g>

  <!-- Footer label -->
  <text x="320" y="742" class="muted" font-size="11">Monarc — ERP interface (placeholder)</text>
</svg>
